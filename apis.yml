name: Huscarl
description: >-
  Huscarl is an AI-native actuarial advisory firm focused on corporate
  self-insurance and captive insurance programs. The company provides
  actuarial intelligence and independent advisory for captive managers and
  owners, including feasibility studies for captive insurance entities,
  pricing and underwriting of uncommon risks with limited data, and reserve
  estimation and actuarial opinions. It helps large corporations determine
  whether they are paying the right amount for coverage and optimize their
  insurance strategy. Huscarl was founded by Alex Musy (CEO) and Paulien
  Jeunesse, who previously built cyber parametric insurance at Descartes
  Underwriting, and is a Y Combinator (Spring 2026) company based in San
  Francisco. As a professional-services actuarial firm it currently exposes
  no public developer API, SDK, or documentation surface.
